[package]
name = "ds-helper"
version = "1.0.0"
description = "DS_helper offline data-structure helper"
authors = ["DS_helper"]
edition = "2021"

[lib]
name = "ds_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "DS_helper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
